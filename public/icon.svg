<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Arendora">
  <!-- Arendora icon.svg — lettermark 120x120 для выдачи Яндекса (просьба CEO, 01.11.2026).
       Исходного SVG-логотипа в репозитории нет (public/ — только PNG), поэтому lettermark:
       брендовый градиент как в icon-512.png и инлайн-favicon (#0F766E -> #14B8A6),
       буква «A» белым — в стиле контурного домика брендовой иконки (stroke, round joins). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <path d="M34 92 60 26 86 92" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 70 H75" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
</svg>
