<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="max-image-preview:large" />
    <!-- __SITE_URL__ и __BASE__ заменяются на этапе сборки (vite.config.js) -->

    <meta property="og:type" content="website" />

    <meta property="og:image" content="__SITE_URL__img/hero-city.jpg" />
    <meta property="og:image:width" content="1406" />
    <meta property="og:image:height" content="1120" />
    <meta property="og:image:alt" content="Дашборд Arendora: объекты, платежи и заявки в одном окне" />
    <meta name="twitter:image" content="__SITE_URL__img/hero-city.jpg" />
    <meta property="og:site_name" content="Arendora" />
    <meta property="og:title" content="Arendora — управление недвижимостью без таблиц и хаоса" />
    <meta property="og:description" content="Объекты, арендаторы, платежи, заявки и аналитика в одном окне. Связи создаются автоматически. Запуск за 15 минут — бесплатно до 3 объектов." />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arendora — управление недвижимостью без таблиц и хаоса" />
    <meta name="twitter:description" content="Запуск за 15 минут. Автосвязывание объектов, арендаторов и платежей. Бесплатно до 3 объектов." />
    <title>Arendora — управление недвижимостью без таблиц и хаоса</title>
    <!-- Разметка сущностей для Google/Яндекс. FAQPage и HowTo убраны: Google
         полностью отключил их rich-результаты (FAQ — в мае 2026), пользы ноль,
         а тексты дублировали лендинг и требовали синхронизации.
         Важно: aggregateRating в SoftwareApplication добавлять только при
         появлении настоящих оценок пользователей — вымышленные караются. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Arendora",
          "url": "__SITE_URL__",
          "logo": "__SITE_URL__icon-512.png",
          "email": "support@arendora.ru",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "support@arendora.ru",
            "availableLanguage": ["ru", "en"]
          }
        },
        {
          "@type": "WebSite",
          "name": "Arendora",
          "url": "__SITE_URL__",
          "inLanguage": ["ru", "en"]
        },
        {
          "@type": "SoftwareApplication",
          "name": "Arendora",
          "url": "__SITE_URL__",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "inLanguage": ["ru", "en"],
          "description": "Облачная платформа управления недвижимостью: объекты, арендаторы, платежи, заявки, документы и аналитика. Связи создаются автоматически.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "RUB",
            "description": "Тариф Free: бесплатно до 3 объектов и 3 арендаторов"
          },
          "featureList": "Автосвязывание объектов, арендаторов и платежей; график платежей на год; напоминания об оплатах; заявки жильцов с фото и статусами; документы; аналитика доходов"
        }
      ]
    }
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Arendora" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230F766E'/%3E%3Cstop offset='1' stop-color='%2314B8A6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 23V13l7-5 7 5v10h-4.5v-6h-5v6z' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <div
        id="boot-splash"
        style="min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#F8FAFC"
      >
        <div
          style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0F766E,#14B8A6);display:flex;align-items:center;justify-content:center"
        >
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none"><path d="M9 23V13l7-5 7 5v10h-4.5v-6h-5v6z" fill="white"/></svg>
        </div>
        <div style="font:600 15px system-ui,sans-serif;color:#0F172A">Arendora</div>
        <div style="width:26px;height:26px;border:3px solid #E2E8F0;border-top-color:#0F766E;border-radius:50%;animation:pm-spin 0.8s linear infinite"></div>
      </div>
      <style>#boot-splash{opacity:1;transition:opacity .2s}@keyframes pm-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      // Мини-мониторинг: фатальная ошибка видна в заголовке вкладки
      // и прямо на экране загрузки (если приложение не смонтировалось)
      function pmShowFatal(kind, text) {
        document.title = kind + ": " + text;
        var old = document.getElementById("pm-fatal");
        if (old) old.remove();
        var el = document.createElement("div");
        el.id = "pm-fatal";
        el.style.cssText =
          "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;" +
          "background:#FEF2F2;border:1px solid #FCA5A5;color:#B91C1C;" +
          "font:12px/1.5 monospace;padding:12px;border-radius:8px;word-break:break-all;max-height:45vh;overflow:auto";
        el.innerHTML = "<b>" + kind + "</b><br>" + text;
        document.body.appendChild(el);
      }
      window.addEventListener("error", (e) => {
        pmShowFatal("ERR", e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", (e) => {
        pmShowFatal("REJ", e.reason?.message || String(e.reason));
      });
    </script>
    <script>
      // Тема до монтирования React: иначе у выбравших тёмную тему
      // при каждой загрузке светлая оболочка мигает на мгновение.
      // Ключ повторяет KEY в src/lib/theme.jsx.
      try {
        if (localStorage.getItem("arendora:theme") === "dark") {
          document.documentElement.classList.add("dark");
          var splash = document.getElementById("boot-splash");
          if (splash) {
            splash.style.background = "#1E293B";
            var t = splash.querySelector("div:nth-child(2)");
            if (t) t.style.color = "#F1F5F9";
            var spin = splash.querySelector("div:nth-child(3)");
            if (spin) {
              spin.style.borderColor = "#334155";
              spin.style.borderTopColor = "#2DD4BF";
            }
          }
        }
      } catch (e) {}
    </script>
    <script>
      // Яндекс.Метрика. ID подставляется на этапе сборки из переменной
      // окружения VITE_YANDEX_METRICA_ID (см. vite.config.js); пока она не
      // задана, счётчик не подключается вовсе — ноль лишних запросов.
      (function () {
        var id = "__METRICA_ID__".replace(/[^0-9]/g, "");
        if (!id) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://mc.yandex.ru/metrika/tag.js";
        s.onload = function () {
          if (!window.ym) return;
          window.ym(id, "init", {
            clickmap: true,
            trackLinks: true,
            accurateTrackBounce: true,
            webvisor: true,
          });
        };
        document.head.appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
