      // Мини-мониторинг: последняя фатальная ошибка видна в заголовке вкладки
      window.addEventListener("error", (e) => {
        document.title = "ERR: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno;
