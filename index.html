    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230F766E'/%3E%3Cstop offset='1' stop-color='%2314B8A6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 23V13l7-5 7 5v10h-4.5v-6h-5v6z' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <div
        id="boot-splash"
        style="min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#F8FAFC"
      >
        <div
          style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0F766E,#14B8A6);display:flex;align-items:center;justify-content:center"
        >
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none"><path d="M9 23V13l7-5 7 5v10h-4.5v-6h-5v6z" fill="white"/></svg>
        </div>
        <div style="font:600 15px system-ui,sans-serif;color:#0F172A">Arendora</div>
        <div style="width:26px;height:26px;border:3px solid #E2E8F0;border-top-color:#0F766E;border-radius:50%;animation:pm-spin 0.8s linear infinite"></div>
      </div>
      <style>#boot-splash{opacity:1;transition:opacity .2s}@keyframes pm-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      // Мини-мониторинг: фатальная ошибка видна в заголовке вкладки
      // и прямо на экране загрузки (если приложение не смонтировалось)
      function pmShowFatal(kind, text) {
        document.title = kind + ": " + text;
        var old = document.getElementById("pm-fatal");
        if (old) old.remove();
        var el = document.createElement("div");
        el.id = "pm-fatal";
        el.style.cssText =
          "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;" +
          "background:#FEF2F2;border:1px solid #FCA5A5;color:#B91C1C;" +
          "font:12px/1.5 monospace;padding:12px;border-radius:8px;word-break:break-all;max-height:45vh;overflow:auto";
        el.innerHTML = "<b>" + kind + "</b><br>" + text;
        document.body.appendChild(el);
      }
      window.addEventListener("error", (e) => {
        pmShowFatal("ERR", e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", (e) => {
        pmShowFatal("REJ", e.reason?.message || String(e.reason));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
